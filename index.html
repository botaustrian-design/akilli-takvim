<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Termin Takvimi</title>
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #a855f7;
            --bg-dark: #0f172a;
            --glass: rgba(255, 255, 255, 0.05);
            --text: #f8fafc;
        }

        body { 
            font-family: 'Inter', system-ui, sans-serif; 
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); 
            color: var(--text); margin: 0; padding: 20px; 
            display: flex; justify-content: center; min-height: 100vh;
        }

        .card { 
            width: 100%; max-width: 450px; background: var(--glass);
            backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1);
            padding: 25px; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .header h2 { margin: 0; font-size: 1.5rem; background: linear-gradient(to right, #6366f1, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .btn { 
            background: linear-gradient(135deg, #6366f1, #a855f7); 
            color: white; border: none; padding: 10px 20px; border-radius: 12px; 
            font-weight: 600; cursor: pointer; transition: transform 0.2s, opacity 0.2s;
        }
        .btn:hover { transform: scale(1.05); opacity: 0.9; }

        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
        .day-cell { 
            padding: 10px 0; border-radius: 12px; cursor: pointer; 
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.3s; text-align: center; font-size: 0.9rem;
        }
        .day-cell:hover { background: var(--primary); transform: translateY(-2px); }
        .day-cell.has-event { border: 1px solid var(--primary); color: var(--primary); font-weight: bold; }

        .modal { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); 
            justify-content: center; align-items: center; z-index: 1000;
        }
        .modal.active { display: flex; }
        .modal-content { 
            background: #1e293b; padding: 30px; border-radius: 24px; width: 90%; max-width: 400px;
            border: 1px solid rgba(255,255,255,0.1); animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes pop { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        input, textarea { 
            width: 100%; padding: 12px; margin: 10px 0; background: #0f172a; 
            border: 1px solid #334155; color: white; border-radius: 12px; box-sizing: border-box;
        }

        .event-item { 
            background: rgba(255,255,255,0.03); padding: 15px; border-radius: 16px; 
            margin-top: 10px; display: flex; justify-content: space-between; align-items: center;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <h2 id="monthYearTitle">Ağustos 2026</h2>
            <div>
                <button class="btn" style="padding: 5px 10px;" onclick="changeMonth(-1)">‹</button>
                <button class="btn" style="padding: 5px 10px;" onclick="changeMonth(1)">›</button>
            </div>
        </div>

        <div class="calendar-grid" id="calendarDays"></div>

        <div id="eventList" style="margin-top:20px;"></div>
    </div>

    <div class="modal" id="eventModal">
        <div class="modal-content">
            <h3 id="modalDateTitle">Tarih</h3>
            <input type="text" id="eventTitleInput" placeholder="Etkinlik İsmi">
            <textarea id="eventBioInput" rows="2" placeholder="Bio / Açıklama"></textarea>
            <input type="time" id="eventTimeInput" value="12:00">
            <div style="display:flex; gap:10px; margin-top:15px;">
                <button class="btn" style="flex:1; background: #ef4444;" onclick="closeModal()">İptal</button>
                <button class="btn" style="flex:1;" onclick="saveEvent()">Kaydet</button>
            </div>
        </div>
    </div>

    <script>
        // JS mantığı aynı, sadece tasarım güncellendi
        let currentDate = new Date();
        let events = JSON.parse(localStorage.getItem('calendar_events')) || [];
        let selectedDateStr = '';

        function initCalendar() {
            const y = currentDate.getFullYear(), m = currentDate.getMonth();
            document.getElementById('monthYearTitle').innerText = new Intl.DateTimeFormat('tr-TR', { month: 'long', year: 'numeric' }).format(currentDate);
            const d = new Date(y, m+1, 0).getDate();
            const start = (new Date(y, m, 1).getDay() + 6) % 7;
            const grid = document.getElementById('calendarDays'); grid.innerHTML = '';
            for(let i=0; i<start; i++) grid.innerHTML += '<div></div>';
            for(let i=1; i<=d; i++) {
                const date = `${y}-${String(m+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
                const hasEvent = events.some(e => e.date === date);
                grid.innerHTML += `<div class="day-cell ${hasEvent ? 'has-event' : ''}" onclick="openModal('${date}')">${i}</div>`;
            }
            renderList();
        }

        function openModal(date) { selectedDateStr = date; document.getElementById('eventModal').classList.add('active'); }
        function closeModal() { document.getElementById('eventModal').classList.remove('active'); }
        function saveEvent() {
            events.push({ id: Date.now(), date: selectedDateStr, title: document.getElementById('eventTitleInput').value, bio: document.getElementById('eventBioInput').value, time: document.getElementById('eventTimeInput').value });
            localStorage.setItem('calendar_events', JSON.stringify(events));
            closeModal(); initCalendar();
        }
        function changeMonth(dir) { currentDate.setMonth(currentDate.getMonth() + dir); initCalendar(); }
        function renderList() {
            const list = document.getElementById('eventList'); list.innerHTML = '';
            events.forEach(e => list.innerHTML += `<div class="event-item"><div><strong>${e.title}</strong><br><small>${e.date} @ ${e.time}</small></div><button onclick="deleteEvent(${e.id})" style="border:none; background:transparent; color:red;">✕</button></div>`);
        }
        function deleteEvent(id) { events = events.filter(e => e.id !== id); localStorage.setItem('calendar_events', JSON.stringify(events)); initCalendar(); }
        
        initCalendar();
    </script>
</body>
</html>
