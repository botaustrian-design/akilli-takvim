<!DOCTYPE html>
<html lang="tr">
<head>
   <link rel="manifest" href="./manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Termin Asistanı</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --border: #334155;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #6366f1;
            --secondary: #a855f7;
        }

        .light-mode {
            --bg: #f1f5f9;
            --card-bg: #ffffff;
            --border: #cbd5e1;
            --text: #0f172a;
            --text-muted: #64748b;
        }

        body { 
            font-family: 'Inter', system-ui, sans-serif; 
            background: var(--bg); 
            color: var(--text); margin: 0; padding: 15px; 
            display: flex; justify-content: center; min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }

        .card { 
            width: 100%; max-width: 480px; background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 20px; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            box-sizing: border-box;
        }

        .top-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        
        .notification-banner {
            background: #ef4444; color: white; padding: 10px; border-radius: 12px;
            text-align: center; margin-bottom: 15px; font-size: 0.8rem; font-weight: bold; cursor: pointer;
        }

        .countdown-box {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white; padding: 12px; border-radius: 16px; text-align: center;
            margin-bottom: 15px; font-size: 0.85rem; font-weight: 600;
        }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .header h2 { margin: 0; font-size: 1.2rem; color: var(--text); }

        .btn { 
            background: linear-gradient(135deg, var(--primary), var(--secondary)); 
            color: white; border: none; padding: 8px 12px; border-radius: 10px; 
            font-weight: 600; cursor: pointer; font-size: 0.8rem; transition: transform 0.2s;
        }
        .btn:hover { transform: scale(1.03); }

        .search-box { width: 100%; padding: 10px 15px; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 12px; box-sizing: border-box; margin-bottom: 15px; font-size: 0.9rem; }

        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
        .day-name { font-size: 0.75rem; color: var(--text-muted); font-weight: bold; padding-bottom: 5px; }
        
        .day-cell { 
            padding: 12px 0; border-radius: 10px; cursor: pointer; 
            background: var(--bg); border: 1px solid var(--border); color: var(--text);
            transition: all 0.2s; font-size: 0.85rem; position: relative;
        }
        .day-cell:hover:not(.past) { background: var(--primary); color: white; border-color: var(--primary); transform: translateY(-2px); }
        .day-cell.has-event::after { content: ''; position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%); width: 5px; height: 5px; background: #38bdf8; border-radius: 50%; }
        .day-cell.past { opacity: 0.2; cursor: not-allowed; }

        .modal { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); 
            justify-content: center; align-items: center; z-index: 1000; padding: 15px;
        }
        .modal.active { display: flex; }
        .modal-content { 
            background: var(--card-bg); padding: 20px; border-radius: 20px; width: 100%; max-width: 360px;
            border: 1px solid var(--border); box-shadow: 0 15px 30px rgba(0,0,0,0.4);
        }

        .form-control { width: 100%; padding: 10px; margin: 6px 0; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 10px; box-sizing: border-box; font-size: 0.9rem; }
        
        .category-selector { display: flex; gap: 8px; margin: 6px 0; }
        .cat-btn { flex: 1; padding: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); border-radius: 8px; cursor: pointer; font-size: 0.75rem; font-weight: bold; }
        .cat-btn.selected { border-color: var(--primary); background: var(--primary); color: white; }

        .event-item { 
            background: var(--bg); padding: 10px 12px; border-radius: 12px; 
            margin-top: 8px; display: flex; justify-content: space-between; align-items: center;
            border-left: 4px solid var(--primary); font-size: 0.85rem; color: var(--text);
        }
        .badge { font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; background: rgba(255,255,255,0.1); margin-left: 5px; }
    </style>
</head>
<body>

    <div class="card">
        <div id="notifBanner" class="notification-banner" onclick="requestNotificationPermission()" style="display:none;">
            🔔 Ses ve Bildirimler için Tıkla (İzin Ver)
        </div>

        <div class="top-actions">
            <button class="btn" onclick="toggleTheme()" id="themeBtn">☀️ Tema</button>
            <div>
                <button class="btn" onclick="exportData()" style="background:#10b981;">📥 Yedekle</button>
                <button class="btn" onclick="document.getElementById('importFile').click()" style="background:#f59e0b;">📤 Yükle</button>
                <input type="file" id="importFile" style="display:none" onchange="importData(event)">
            </div>
        </div>

        <div class="countdown-box" id="countdownBox">⏳ Yaklaşan etkinlik yok</div>

        <input type="text" class="search-box" id="searchInput" placeholder="🔍 Termin ara..." oninput="renderList()">

        <div class="header">
            <h2 id="monthYearTitle">Ağustos 2026</h2>
            <div>
                <button class="btn" style="padding: 4px 8px;" onclick="changeMonth(-1)">‹</button>
                <button class="btn" style="padding: 4px 8px;" onclick="changeMonth(1)">›</button>
            </div>
        </div>

        <div class="calendar-grid">
            <div class="day-name">Pzt</div><div class="day-name">Sal</div><div class="day-name">Çar</div>
            <div class="day-name">Per</div><div class="day-name">Cum</div><div class="day-name">Cmt</div><div class="day-name">Paz</div>
        </div>
        <div class="calendar-grid" id="calendarDays" style="margin-top: 6px;"></div>

        <div id="eventList" style="margin-top:15px; max-height: 200px; overflow-y: auto;"></div>
    </div>

    <!-- Modal -->
    <div class="modal" id="eventModal">
        <div class="modal-content">
            <h3 style="margin-top:0; font-size:1rem; color:var(--text);">📌 Yeni Termin Ekle</h3>
            <input type="text" class="form-control" id="eventTitleInput" placeholder="Etkinlik İsmi">
            
            <div class="category-selector">
                <button class="cat-btn selected" onclick="setCategory('İş', this)" style="--primary:#6366f1;">İş</button>
                <button class="cat-btn" onclick="setCategory('Özel', this)" style="--primary:#ec4899;">Özel</button>
                <button class="cat-btn" onclick="setCategory('Eğitim', this)" style="--primary:#eab308;">Eğitim</button>
            </div>

            <textarea class="form-control" id="eventBioInput" rows="2" placeholder="Bio / Açıklama"></textarea>
            
            <label style="font-size: 0.75rem; color: var(--text-muted); display: block; margin-top: 5px;">Etkinlik Saati:</label>
            <input type="time" class="form-control" id="eventTimeInput" value="12:00">

            <label style="font-size: 0.75rem; color: var(--text-muted); display: block; margin-top: 5px;">🔔 Ne zaman çalsın? (Bildirim Saati):</label>
            <input type="time" class="form-control" id="eventAlarmInput" value="11:55">

            <div style="display:flex; gap:8px; margin-top:12px;">
                <button class="btn" style="flex:1; background:#64748b;" onclick="closeModal()">İptal</button>
                <button class="btn" style="flex:1;" onclick="saveEvent()">Kaydet</button>
            </div>
        </div>
    </div>

    <script>
        let currentDate = new Date();
        let events = JSON.parse(localStorage.getItem('pro_calendar_events_v2')) || [];
        let selectedDateStr = '';
        let selectedCategory = 'İş';

        function setCategory(cat, btn) {
            selectedCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
        }

        function initCalendar() {
            const y = currentDate.getFullYear(), m = currentDate.getMonth();
            const monthNames = ["Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran", "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"];
            document.getElementById('monthYearTitle').innerText = `${monthNames[m]} ${y}`;
            
            const totalDays = new Date(y, m+1, 0).getDate();
            const startDay = (new Date(y, m, 1).getDay() + 6) % 7;
            const grid = document.getElementById('calendarDays'); 
            grid.innerHTML = '';

            for(let i=0; i<startDay; i++) grid.innerHTML += `<div></div>`;

            const today = new Date(); today.setHours(0,0,0,0);

            for(let i=1; i<=totalDays; i++) {
                const cellDate = new Date(y, m, i);
                const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
                const hasEvent = events.some(e => e.date === dateStr);
                const isPast = cellDate < today;

                let className = 'day-cell';
                if (isPast) className += ' past';
                if (hasEvent) className += ' has-event';

                if (isPast) {
                    grid.innerHTML += `<div class="${className}">${i}</div>`;
                } else {
                    grid.innerHTML += `<div class="${className}" onclick="openModal('${dateStr}')">${i}</div>`;
                }
            }
            renderList();
        }

        function openModal(date) { 
            selectedDateStr = date; 
            document.getElementById('eventTitleInput').value = '';
            document.getElementById('eventBioInput').value = '';
            document.getElementById('eventModal').classList.add('active'); 
        }
        
        function closeModal() { document.getElementById('eventModal').classList.remove('active'); }
        
        function saveEvent() {
            const title = document.getElementById('eventTitleInput').value.trim();
            if(!title) { alert('Etkinlik ismi gerekli!'); return; }
            
            events.push({ 
                id: Date.now(), 
                date: selectedDateStr, 
                title: title, 
                bio: document.getElementById('eventBioInput').value, 
                time: document.getElementById('eventTimeInput').value,
                alarmTime: document.getElementById('eventAlarmInput').value,
                category: selectedCategory,
                alerted: false
            });
            localStorage.setItem('pro_calendar_events_v2', JSON.stringify(events));
            closeModal(); initCalendar();
        }
        
        function changeMonth(dir) { currentDate.setMonth(currentDate.getMonth() + dir); initCalendar(); }
        
        function renderList() {
            const list = document.getElementById('eventList'); 
            const query = document.getElementById('searchInput').value.toLowerCase();
            list.innerHTML = '';
            
            const filtered = events.filter(e => e.title.toLowerCase().includes(query) || e.bio.toLowerCase().includes(query));
            filtered.sort((a, b) => new Date(a.date + 'T' + a.time) - new Date(b.date + 'T' + b.time));

            filtered.forEach(e => {
                let catColor = e.category === 'Özel' ? '#ec4899' : (e.category === 'Eğitim' ? '#eab308' : '#6366f1');
                list.innerHTML += `
                    <div class="event-item" style="border-left-color: ${catColor};">
                        <div>
                            <strong>${e.title}</strong> <span class="badge" style="background:${catColor}33; color:${catColor};">${e.category}</span><br>
                            <small style="color:var(--text-muted);">📅 ${e.date} ⏰ ${e.time} (Alarm: ${e.alarmTime || e.time})</small>
                        </div>
                        <button onclick="deleteEvent(${e.id})" style="border:none; background:transparent; color:#ef4444; cursor:pointer;">🗑️</button>
                    </div>`;
            });
        }
        
        function deleteEvent(id) { 
            events = events.filter(e => e.id !== id); 
            localStorage.setItem('pro_calendar_events_v2', JSON.stringify(events)); 
            initCalendar(); 
        }

        // Alarm ve Bildirim Kontrolü
        setInterval(() => {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');

            const currentDateStr = `${year}-${month}-${day}`;
            const currentTimeStr = `${hours}:${minutes}`;

            events.forEach(e => {
                const triggerTime = e.alarmTime || e.time;
                if (e.date === currentDateStr && triggerTime === currentTimeStr && !e.alerted) {
                    e.alerted = true;
                    localStorage.setItem('pro_calendar_events_v2', JSON.stringify(events));
                    
                    speakText(`Dikkat! ${e.title} zamanı geldi.`);
                    if ("Notification" in window && Notification.permission === "granted") {
                        new Notification("Alarm: " + e.title, { body: e.bio || "Termin vakti geldi!" });
                    }
                }
            });
        }, 10000);

        function speakText(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'tr-TR';
                window.speechSynthesis.speak(utterance);
            }
        }

        function requestNotificationPermission() {
            if ("Notification" in window) {
                Notification.requestPermission().then(permission => {
                    if (permission === "granted") {
                        document.getElementById('notifBanner').style.display = 'none';
                        new Notification("Harika!", { body: "Bildirimler aktif edildi." });
                    }
                });
            }
        }

        if ("Notification" in window && Notification.permission !== "granted") {
            document.getElementById('notifBanner').style.display = 'block';
        }

        // Geri Sayım
        setInterval(() => {
            const now = new Date();
            const futureEvents = events
                .map(e => ({ ...e, datetime: new Date(e.date + 'T' + e.time) }))
                .filter(e => e.datetime > now)
                .sort((a, b) => a.datetime - b.datetime);

            const box = document.getElementById('countdownBox');
            if (futureEvents.length === 0) {
                box.innerText = "⏳ Yaklaşan etkinlik yok";
                return;
            }

            const next = futureEvents[0];
            const diff = next.datetime - now;
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const mins = Math.floor((diff / 1000 / 60) % 60);

            box.innerText = `⏳ "${next.title}" için: ${days > 0 ? days + 'g ' : ''}${hours}s ${mins}dk kaldı`;
        }, 1000);

        // Tema Değiştirici
        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
            document.getElementById('themeBtn').innerText = isLight ? '🌙 Tema' : '☀️ Tema';
        }

        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light-mode');
            document.getElementById('themeBtn').innerText = '🌙 Tema';
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(events));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", "termin_yedekleri.json");
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    events = JSON.parse(e.target.result);
                    localStorage.setItem('pro_calendar_events_v2', JSON.stringify(events));
                    initCalendar();
                    alert('Yedek yüklendi!');
                } catch(err) { alert('Hatalı dosya!'); }
            };
            reader.readAsText(file);
        }
        
        initCalendar();
    </script>
</body>
                    </html>
